<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>My Live Connect</title>

<style>
body {
  background: linear-gradient(135deg,#111827,#581c87);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px;
}
.card {
  background: #ffffff15;
  padding: 25px;
  border-radius: 20px;
}
button {
  background: #a855f7;
  color: white;
  padding: 15px;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  margin: 10px;
}
.stop { background: #ef4444; }
</style>
</head>

<body>

<h1>💜 My Live Connect</h1>

<div class="card">

<h2>📷 Camera + 🎤 Voice</h2>

<p>
Your camera and microphone will be shared
only after you choose to join.
</p>

<button onclick="joinCall()">
✅ Accept & Start
</button>

<button class="stop" onclick="stopCall()">
🛑 Stop
</button>

<p id="status">🔴 Not Connected</p>

</div>

<script>
let callWindow = null;

function joinCall() {
  document.getElementById("status").innerText =
    "🟢 Opening Video Call";

  callWindow = window.open(
    "https://meet.jit.si/MyLiveConnectPrivate2026",
    "_blank"
  );

  if (!callWindow) {
    alert("Please allow pop-ups to join the call.");
  }
}

function stopCall() {
  if (callWindow && !callWindow.closed) {
    callWindow.close();
  }

  document.getElementById("status").innerText =
    "🔴 Disconnected";
}
</script>

</body>
</html>
