<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Live Camera & Voice</title>

<style>
body {
  background: #111827;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 20px;
}

video {
  width: 100%;
  max-width: 400px;
  background: black;
  border-radius: 15px;
  margin-top: 20px;
}

button {
  padding: 15px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 16px;
}

.start { background: green; }
.stop { background: red; }

</style>
</head>

<body>

<h2>📷 Live Camera + 🎤 Voice</h2>

<p>
Camera and microphone sharing
require your permission.
</p>

<button class="start" onclick="startSharing()">
Start Camera & Mic
</button>

<button class="stop" onclick="stopSharing()">
Stop Sharing
</button>

<video id="video"
autoplay playsinline muted></video>

<h3 id="status">🔴 Camera & Mic OFF</h3>

<script>

let stream = null;

async function startSharing() {
  try {
    if (stream) return;

    stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
      });

    document.getElementById("video")
      .srcObject = stream;

    document.getElementById("status")
      .innerText = "🟢 Camera & Mic ON";

  } catch (error) {
    alert("Camera and microphone permission required");
  }
}

function stopSharing() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  document.getElementById("video")
    .srcObject = null;

  document.getElementById("status")
    .innerText = "🔴 Camera & Mic OFF";
}

window.addEventListener("pagehide", stopSharing);

</script>

</body>
</html>
